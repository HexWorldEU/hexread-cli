name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly re-scan so new CVEs surface even when the repo is dormant

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # latest patched Go; go.mod stays the minimum language version
      - run: go build ./...
      - run: go vet ./...
      # staticcheck flags deprecated API usage (SA1019), which go vet does not.
      - run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go test -race -cover ./...
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          [ -z "$out" ] || { echo "gofmt needed on:"; echo "$out"; exit 1; }
      # The CLI ships as a single static cgo-free binary - verify every release target compiles.
      - name: cross-compile (cgo-free, all release targets)
        run: |
          set -e
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            echo "→ $t"
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/hexread
          done
          echo "✓ cgo-free for all targets"
      - run: ./scripts/check-archive-name.sh
      - run: shellcheck scripts/*.sh # preinstalled on the runner image

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable # scan with the latest patched toolchain
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
